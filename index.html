<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <title>THE OTHER SIDE — Two worlds. One mind.</title>
    <!-- Poki SDK v2 -->
    <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
    <style>
      :root {
        --mobile-btn-size: 56px;
        --mobile-gap-x: 12px;
        --mobile-gap-y: 10px;
      }

      @media (max-height: 420px) {
        :root {
          --mobile-btn-size: 50px;
          --mobile-gap-x: 10px;
          --mobile-gap-y: 8px;
        }
      }

      @media (min-height: 520px) and (orientation: landscape) {
        :root {
          --mobile-btn-size: 60px;
          --mobile-gap-x: 14px;
          --mobile-gap-y: 12px;
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000000;
        display: flex;
        justify-content: center;
        align-items: center;
        touch-action: none;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      #game-container {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        overflow: hidden;
        margin: 0;
        padding: 0;
      }

      canvas {
        display: block;
        margin: 0 !important;
        margin-left: 0 !important;
        margin-right: 0 !important;
        margin-top: 0 !important;
        margin-bottom: 0 !important;
        max-width: 100vw;
        max-height: 100vh;
        max-height: 100dvh;
        box-shadow: 0 0 40px rgba(255, 255, 255, 0.05);
      }

      /* -------------------------------------------------------------
         THEMED ROTATION OVERLAY (PORTRAIT GUIDANCE)
         ------------------------------------------------------------- */
      .orientation-overlay {
        position: fixed;
        inset: 0;
        background: #000000;
        z-index: 99999;
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 32px 24px;
        color: #ffffff;
      }

      /* Show only in portrait on mobile/tablet devices */
      @media (orientation: portrait) and (max-width: 1024px) {
        .orientation-overlay {
          display: flex;
        }
      }

      /* Never show on desktop mice */
      @media (hover: hover) and (pointer: fine) and (min-width: 1025px) {
        .orientation-overlay {
          display: none !important;
        }
      }

      .rotation-icon-wrapper {
        width: 80px;
        height: 80px;
        margin-bottom: 28px;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
      }

      .phone-svg {
        width: 64px;
        height: 64px;
        animation: rotatePhone 2.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        transform-origin: center;
      }

      @keyframes rotatePhone {
        0% {
          transform: rotate(0deg);
        }
        25% {
          transform: rotate(0deg);
        }
        60% {
          transform: rotate(-90deg);
        }
        85% {
          transform: rotate(-90deg);
        }
        100% {
          transform: rotate(0deg);
        }
      }

      .rotation-title {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 3px;
        color: #ffffff;
        margin-bottom: 12px;
        text-transform: uppercase;
      }

      .rotation-subtitle {
        font-size: 13px;
        font-weight: 400;
        letter-spacing: 1.5px;
        color: #888888;
        max-width: 280px;
        line-height: 1.6;
        text-transform: uppercase;
      }

      .rotation-tagline {
        margin-top: 36px;
        font-size: 11px;
        letter-spacing: 4px;
        color: #00e5ff;
        font-weight: 600;
        opacity: 0.85;
      }

      /* -------------------------------------------------------------
         INTEGRATED MOBILE GAMEPLAY CONTROLS
         Bottom-Left: [ LEFT ] [ RIGHT ] (Horizontal)
         Bottom-Right: [ UP ] / [ DOWN ] (Vertical Stack)
         ------------------------------------------------------------- */
      .mobile-controls {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 1000;
        transition: opacity 0.2s ease, visibility 0.2s ease;
      }

      .mobile-controls.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .mobile-controls.visible {
        opacity: 1;
        visibility: visible;
      }

      /* Hide mobile controls on desktop mice / screens > 1024px */
      @media (hover: hover) and (pointer: fine) and (min-width: 1025px) {
        .mobile-controls {
          display: none !important;
        }
      }

      /* Bottom-Left Cluster: [ LEFT ] [ RIGHT ] horizontally */
      .mobile-cluster-left {
        display: flex;
        flex-direction: row;
        gap: var(--mobile-gap-x);
        position: fixed;
        left: max(16px, env(safe-area-inset-left, 16px));
        bottom: max(16px, env(safe-area-inset-bottom, 16px));
        pointer-events: auto;
        touch-action: none;
      }

      /* Bottom-Right Cluster: [ UP ] over [ DOWN ] vertically */
      .mobile-cluster-right {
        display: flex;
        flex-direction: column;
        gap: var(--mobile-gap-y);
        position: fixed;
        right: max(16px, env(safe-area-inset-right, 16px));
        bottom: max(16px, env(safe-area-inset-bottom, 16px));
        align-items: center;
        pointer-events: auto;
        touch-action: none;
      }

      .mobile-btn {
        width: var(--mobile-btn-size);
        height: var(--mobile-btn-size);
        background: rgba(12, 12, 12, 0.88);
        border: 1.5px solid rgba(255, 255, 255, 0.7);
        border-radius: 12px;
        color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        outline: none;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.65);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        transition: transform 0.08s ease, background 0.08s ease, border-color 0.08s ease;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
      }

      .mobile-btn:active,
      .mobile-btn.pressed {
        background: #00e5ff;
        border-color: #00e5ff;
        color: #000000;
        transform: scale(0.92);
        box-shadow: 0 0 18px rgba(0, 229, 255, 0.7);
      }

      .mobile-btn svg {
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!-- Themed Device Rotation Overlay -->
    <div id="orientation-overlay" class="orientation-overlay" aria-live="polite">
      <div class="rotation-icon-wrapper">
        <svg class="phone-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Smartphone body -->
          <rect x="18" y="8" width="28" height="48" rx="5" stroke="#FFFFFF" stroke-width="2.5" />
          <line x1="28" y1="12" x2="36" y2="12" stroke="#666666" stroke-width="2" stroke-linecap="round" />
          <circle cx="32" cy="50" r="2" fill="#00E5FF" />
          <!-- Rotation indicator arc -->
          <path d="M 50 20 A 18 18 0 0 1 54 36" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round" />
          <polygon points="50,36 58,36 54,42" fill="#00E5FF" />
        </svg>
      </div>
      <div class="rotation-title">ROTATE YOUR DEVICE TO PLAY</div>
      <div class="rotation-subtitle">Two Worlds. One Mind. Designed for Landscape Gameplay.</div>
      <div class="rotation-tagline">THE OTHER SIDE</div>
    </div>

    <!-- Phaser Canvas Container -->
    <div id="game-container"></div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
