<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <title>THE OTHER SIDE — Two worlds. One mind.</title>
    <style>
      :root {
        --mobile-btn-size: 72px;
        --mobile-gap-x: 16px;
        --mobile-gap-y: 14px;
      }

      @media (max-height: 440px) {
        :root {
          --mobile-btn-size: 64px;
          --mobile-gap-x: 14px;
          --mobile-gap-y: 12px;
        }
      }

      @media (min-height: 520px) and (orientation: landscape) {
        :root {
          --mobile-btn-size: 80px;
          --mobile-gap-x: 18px;
          --mobile-gap-y: 16px;
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000000;
        display: flex;
        justify-content: center;
        align-items: center;
        touch-action: none;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      #backdrop-canvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: block;
        z-index: 0;
        pointer-events: none;
      }

      #game-container {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        overflow: hidden;
        margin: 0;
        padding: 0;
        z-index: 1;
        background: transparent !important;
      }

      #game-container canvas {
        display: block;
        margin: 0 !important;
        margin-left: 0 !important;
        margin-right: 0 !important;
        margin-top: 0 !important;
        margin-bottom: 0 !important;
        border: none !important;
        outline: none !important;
        box-shadow: none !important;
        max-width: 100vw;
        max-height: 100vh;
        max-height: 100dvh;
      }

      /* -------------------------------------------------------------
         INTEGRATED MOBILE GAMEPLAY CONTROLS
         Bottom-Left: [ LEFT ] [ RIGHT ] (Horizontal)
         Bottom-Right: [ UP ] / [ DOWN ] (Vertical Stack)
         ------------------------------------------------------------- */
      .mobile-controls {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 1000;
        transition: opacity 0.2s ease, visibility 0.2s ease;
      }

      .mobile-controls.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .mobile-controls.visible {
        opacity: 1;
        visibility: visible;
      }

      /* Hide mobile controls on desktop mice / screens > 1024px */
      @media (hover: hover) and (pointer: fine) and (min-width: 1025px) {
        .mobile-controls {
          display: none !important;
        }
      }

      /* Bottom-Left Cluster: [ LEFT ] [ RIGHT ] horizontally */
      .mobile-cluster-left {
        display: flex;
        flex-direction: row;
        gap: var(--mobile-gap-x);
        position: fixed;
        left: max(16px, env(safe-area-inset-left, 16px));
        bottom: max(16px, env(safe-area-inset-bottom, 16px));
        pointer-events: auto;
        touch-action: none;
      }

      /* Bottom-Right Cluster: [ UP ] over [ DOWN ] vertically */
      .mobile-cluster-right {
        display: flex;
        flex-direction: column;
        gap: var(--mobile-gap-y);
        position: fixed;
        right: max(16px, env(safe-area-inset-right, 16px));
        bottom: max(16px, env(safe-area-inset-bottom, 16px));
        align-items: center;
        pointer-events: auto;
        touch-action: none;
      }

      /* Left Cluster: On Real World white background */
      .mobile-cluster-left .mobile-btn {
        background: rgba(18, 18, 18, 0.92);
        border: 1.5px solid rgba(0, 0, 0, 0.25);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
        color: #ffffff;
      }

      /* Right Cluster: On Shadow World dark background */
      .mobile-cluster-right .mobile-btn {
        background: rgba(18, 18, 18, 0.92);
        border: 1.5px solid rgba(255, 255, 255, 0.45);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.65);
        color: #ffffff;
      }

      .mobile-btn {
        width: var(--mobile-btn-size);
        height: var(--mobile-btn-size);
        border-radius: 16px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        outline: none;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        transition: transform 0.08s ease, background 0.08s ease, border-color 0.08s ease;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
      }

      .mobile-btn:active,
      .mobile-btn.pressed {
        background: #00e5ff;
        border-color: #00e5ff;
        color: #000000;
        transform: scale(0.92);
        box-shadow: 0 0 18px rgba(0, 229, 255, 0.7);
      }

      .mobile-btn svg {
        pointer-events: none;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-CZROm4TS.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/phaser-0YPJO2g1.js">
  </head>
  <body>
    <!-- Animated Dual-World Responsive Ambient Backdrop -->
    <canvas id="backdrop-canvas"></canvas>

    <!-- Phaser Canvas Container -->
    <div id="game-container"></div>

  </body>
</html>
